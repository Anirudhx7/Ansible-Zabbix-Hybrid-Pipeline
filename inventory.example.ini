# -------------------------------------------------------------------------
# PRODUCTION INVENTORY EXAMPLE
# -------------------------------------------------------------------------
# Best Practice: Group hosts by function or location first,
# then use :children groups to apply OS-specific variables.
# -------------------------------------------------------------------------

# --- Linux Fleet (Function-based grouping) ---
[webservers_linux]
prod-web-01 ansible_host=10.10.1.5
prod-web-02 ansible_host=10.10.1.6

[dbservers_linux]
prod-db-01  ansible_host=10.10.1.20

# --- Windows Fleet (Function-based grouping) ---
[appservers_windows]
prod-app-01 ansible_host=10.10.2.5
prod-app-02 ansible_host=10.10.2.6

# -------------------------------------------------------------------------
# GROUP HIERARCHY & VARIABLES
# -------------------------------------------------------------------------

# Create a master 'linux' group to apply SSH settings globally
[linux:children]
webservers_linux
dbservers_linux

[linux:vars]
ansible_user=devops_user
ansible_python_interpreter=/usr/bin/python3
# In prod, use keys instead of passwords if possible, or Vault for passwords

# Create a master 'windows' group to apply WinRM settings globally
[windows:children]
appservers_windows

[windows:vars]
ansible_user=Administrator
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm
# Note: In a strict Prod environment with CA certs, set this to 'validate'
ansible_winrm_server_cert_validation=ignore
ansible_winrm_operation_timeout_sec=60
ansible_winrm_read_timeout_sec=70

# -------------------------------------------------------------------------
# TARGET GROUPS
# -------------------------------------------------------------------------
# The playbook targets this group to deploy Zabbix everywhere
[zabbix_targets:children]
linux
windows
